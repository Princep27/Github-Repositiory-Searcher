
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: github_searcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  springboot:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/github_searcher
      DB_USER: postgres
      DB_PASSWORD: postgres
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      - postgres

volumes:
  postgres_data:
